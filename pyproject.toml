[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actelis-mediation"
version = "0.2.0"
description = "Actelis -> Nokia NSP mediation: MIB analysis and a standalone Communicator prototype"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "py7zr>=0.21", "ruff>=0.6"]

[project.scripts]
actelis-mediation = "actelis_mediation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Carried over from the original project with only path fixes applied, so its
# generated CSVs stay byte-reproducible. Style is not worth a rewrite here.
"tools/build_alarm_pm_mapping.py" = ["B007", "E741"]
"tools/extract_servmon.py" = ["B007", "E741", "SIM115"]
